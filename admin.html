<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>管理ページ｜おすすめ飯屋マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
  <header class="app-header admin-header">
    <h1 class="app-title">飯屋マップ 管理ページ</h1>
    <div class="header-actions">
      <a class="header-link" href="./">サイトを見る</a>
      <button type="button" class="link-button" id="logout" hidden>ログアウト</button>
    </div>
  </header>

  <main class="admin">
    <!-- ログイン -->
    <section id="view-login" class="admin-view">
      <form id="login-form" class="card">
        <label for="password">管理パスワード</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit" class="primary-button">ログイン</button>
        <p class="error" hidden></p>
      </form>
    </section>

    <!-- 追加済みの店の一覧 -->
    <section id="view-list" class="admin-view" hidden>
      <button type="button" class="primary-button" id="start-add">＋ 店を追加</button>
      <p class="muted" id="list-summary"></p>
      <ul class="shop-list" id="shop-list"></ul>
    </section>

    <!-- 店名で検索 -->
    <section id="view-search" class="admin-view" hidden>
      <button type="button" class="link-button back-button">← 一覧に戻る</button>
      <label for="search">店の名前で検索</label>
      <input type="search" id="search" placeholder="例：ラーメン、カレー、店名の一部" autocomplete="off">
      <ul class="candidate-list" id="candidates"></ul>
      <button type="button" class="secondary-button" id="start-manual">候補に無い店を、地図で位置を指定して追加</button>
    </section>

    <!-- 追加・編集フォーム -->
    <section id="view-form" class="admin-view" hidden>
      <button type="button" class="link-button back-button">← 一覧に戻る</button>
      <h2 id="form-title"></h2>
      <form id="shop-form" class="card">
        <div id="form-map" class="form-map"></div>
        <p class="muted" id="map-hint"></p>

        <label for="shop-name">店名</label>
        <input type="text" id="shop-name" maxlength="60" required>

        <label for="shop-genre">ジャンル</label>
        <select id="shop-genre"></select>

        <label for="shop-comment">運営の一言（任意・200字まで）</label>
        <textarea id="shop-comment" maxlength="200" rows="3"></textarea>
        <p class="muted counter" id="comment-counter"></p>

        <span class="label">写真（任意）</span>
        <div class="photo-box">
          <div id="photo-preview" class="photo-preview" hidden></div>
          <label class="secondary-button file-button">
            写真を選ぶ
            <input type="file" id="shop-photo" accept="image/*" hidden>
          </label>
          <button type="button" class="link-button" id="photo-remove" hidden>写真を外す</button>
        </div>
        <p class="muted">自分たちで撮った写真だけを使ってください（ネットやグルメサイトの画像は使わない）。人の顔が写らないようにしてください。</p>

        <label class="checkbox" id="visible-row" hidden>
          <input type="checkbox" id="shop-visible"> サイトに表示する
        </label>

        <button type="submit" class="primary-button" id="form-submit"></button>
        <p class="error" hidden></p>
      </form>
    </section>
  </main>

  <div class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
