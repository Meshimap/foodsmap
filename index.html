<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>水道橋・秋葉原 おすすめ飯屋マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
        integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <h1 class="app-title">水道橋・秋葉原 おすすめ飯屋マップ</h1>
      <a class="header-link" href="admin.html">運営用</a>
    </div>
    <nav class="area-buttons" aria-label="エリア移動">
      <!-- js/app.js が config.js の AREAS からボタンを作る -->
    </nav>
    <!-- ジャンルで絞り込むボタン（横にスクロール）。js/app.js が作る -->
    <div class="genre-chips" role="group" aria-label="ジャンルで絞り込み"></div>
  </header>

  <div class="content">
    <main id="map" class="map" aria-label="飲食店の地図"></main>

    <!-- おすすめ数の多い順の一覧（地図と切り替え） -->
    <section id="list-view" class="list-view" aria-label="お店の一覧" hidden>
      <ol class="rank-list"></ol>
    </section>

    <p class="map-message" hidden></p>

    <div class="fab-row">
      <button type="button" class="fab" id="toggle-view">☰ 一覧で見る</button>
      <button type="button" class="fab fab-primary" id="gacha">🎲 迷ったらガチャ</button>
    </div>
  </div>

  <!-- 店の詳細パネル（スマホでは画面下から出る）。中身は js/app.js が作る -->
  <aside class="sheet" id="sheet" aria-label="お店の詳細" hidden>
    <button type="button" class="sheet-close" aria-label="閉じる">×</button>
    <div class="sheet-body"></div>
  </aside>

  <div class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
          integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
